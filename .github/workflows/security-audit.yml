name: Security headers audit

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Header baseline + workers.dev exposure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run security headers audit
        run: scripts/security-headers-audit.sh
